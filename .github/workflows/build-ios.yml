name: Build iOS IPA Package

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Resolve Swift Package Dependencies
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -resolvePackageDependencies

      - name: Build Unsigned iOS App
        run: |
          xcodebuild -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGN_STYLE="Manual" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ALLOW_SIGNING_WITHOUT_TEAM=YES \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build

      - name: Package into IPA
        run: |
          mkdir -p Payload
          APP_DIR=$(find build/Build/Products -type d -name "App.app" | head -n 1)
          if [ -z "$APP_DIR" ]; then
            echo "::error::App.app bundle was not found in build products!"
            exit 1
          fi
          echo "Found app bundle at: $APP_DIR"
          cp -R "$APP_DIR" Payload/
          codesign --force --deep --sign - "Payload/App.app" || true
          zip -r Marib-Portfolio.ipa Payload
          mkdir -p dist-ios
          mv Marib-Portfolio.ipa dist-ios/

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Marib-Portfolio-iOS-IPA
          path: dist-ios/Marib-Portfolio.ipa
          retention-days: 30
