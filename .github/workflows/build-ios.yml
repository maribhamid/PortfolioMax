name: Build iOS IPA Package

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Resolve Swift Package Dependencies
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -resolvePackageDependencies

      - name: Build Unsigned iOS App
        run: |
          set -o pipefail
          xcodebuild -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            VALIDATE_PRODUCT=NO \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=YES \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_ALLOWED=YES \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build 2>&1 | tee xcodebuild.log || {
              echo "::group::Full Xcode Build Log"
              cat xcodebuild.log
              echo "::endgroup::"
              echo "### ❌ Xcode Build Error" >> $GITHUB_STEP_SUMMARY
              echo '```text' >> $GITHUB_STEP_SUMMARY
              tail -n 80 xcodebuild.log >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
              exit 1
            }

      - name: Upload Xcode Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-failure-log
          path: xcodebuild.log

      - name: Package into IPA
        run: |
          mkdir -p Payload
          APP_DIR=$(find build/Build/Products -type d -name "App.app" | head -n 1)
          if [ -z "$APP_DIR" ]; then
            echo "::error::App.app bundle was not found in build products!"
            exit 1
          fi
          echo "Found app bundle at: $APP_DIR"
          cp -R "$APP_DIR" Payload/
          codesign --force --deep --sign - "Payload/App.app" || true
          zip -r Marib-Portfolio.ipa Payload
          mkdir -p dist-ios
          mv Marib-Portfolio.ipa dist-ios/

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Marib-Portfolio-iOS-IPA
          path: dist-ios/Marib-Portfolio.ipa
          retention-days: 30
